<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
    <title id="title">聚合与具现化的往返过程</title>
    <desc id="desc">大量具体角色经过聚合成为统计状态，统计状态又通过锚点、守恒量和分布重新具现化为角色。</desc>
    <defs>
        <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L10,3.5 z" fill="#68513a" />
        </marker>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4d3927" flood-opacity="0.16" />
        </filter>
    </defs>
    <rect width="960" height="500" rx="18" fill="#f5f0e6" />
    <text x="480" y="48" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#2d241b">聚合不是删除，具现化也不是重抽</text>

    <g filter="url(#shadow)">
        <rect x="55" y="105" width="255" height="285" rx="20" fill="#fffaf1" stroke="#9c7650" stroke-width="2" />
        <rect x="353" y="105" width="255" height="285" rx="20" fill="#ead4a5" stroke="#8a673c" stroke-width="2" />
        <rect x="651" y="105" width="255" height="285" rx="20" fill="#fffaf1" stroke="#9c7650" stroke-width="2" />
    </g>

    <g font-family="Microsoft YaHei, sans-serif">
        <text x="182" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#352719">微观状态 x</text>
        <circle cx="110" cy="205" r="20" fill="#b85c38" /><circle cx="180" cy="205" r="20" fill="#5d7692" /><circle cx="250" cy="205" r="20" fill="#7d8d4e" />
        <circle cx="110" cy="270" r="20" fill="#7d8d4e" /><circle cx="180" cy="270" r="20" fill="#b85c38" /><circle cx="250" cy="270" r="20" fill="#5d7692" />
        <text x="182" y="338" text-anchor="middle" font-size="16" fill="#59442f">身份 装备 伤势 关系</text>
        <text x="182" y="366" text-anchor="middle" font-size="16" fill="#59442f">每个个体都有状态</text>

        <text x="480" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#352719">聚合状态 z</text>
        <text x="385" y="200" font-size="17" fill="#49351f">兵力</text><text x="555" y="200" text-anchor="end" font-size="17" font-weight="700" fill="#49351f">200</text>
        <text x="385" y="240" font-size="17" fill="#49351f">粮食</text><text x="555" y="240" text-anchor="end" font-size="17" font-weight="700" fill="#49351f">18 日</text>
        <text x="385" y="280" font-size="17" fill="#49351f">平均训练</text><text x="555" y="280" text-anchor="end" font-size="17" font-weight="700" fill="#49351f">0.63</text>
        <text x="385" y="320" font-size="17" fill="#49351f">士气</text><text x="555" y="320" text-anchor="end" font-size="17" font-weight="700" fill="#49351f">0.71</text>
        <text x="480" y="365" text-anchor="middle" font-size="15" fill="#59442f">另存历史锚点与随机种子</text>

        <text x="778" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#352719">重新具现 R(z)</text>
        <rect x="690" y="180" width="176" height="38" rx="8" fill="#f0ded0" /><text x="778" y="205" text-anchor="middle" font-size="16" fill="#593824">锚点人物保持身份</text>
        <rect x="690" y="235" width="176" height="38" rx="8" fill="#e4e9d3" /><text x="778" y="260" text-anchor="middle" font-size="16" fill="#3f4a24">人口物资严格对账</text>
        <rect x="690" y="290" width="176" height="38" rx="8" fill="#dce4eb" /><text x="778" y="315" text-anchor="middle" font-size="16" fill="#344b61">普通个体按分布采样</text>
        <text x="778" y="365" text-anchor="middle" font-size="15" fill="#59442f">A(R(z)) ≈ z</text>
    </g>

    <path d="M310 225 L345 225" stroke="#68513a" stroke-width="3" marker-end="url(#arrow)" />
    <text x="328" y="210" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#59442f">A</text>
    <path d="M608 270 L643 270" stroke="#68513a" stroke-width="3" marker-end="url(#arrow)" />
    <text x="626" y="255" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#59442f">R</text>
    <path d="M780 420 C780 445 660 450 500 450 C370 450 240 450 180 450" fill="none" stroke="#9c7650" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)" />
    <text x="480" y="477" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#59442f">往返检查：展开再聚合，账不能变</text>
</svg>
